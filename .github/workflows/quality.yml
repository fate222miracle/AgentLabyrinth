name: V0.2 quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.18'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.21.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: |
          uv --cache-dir .uv-cache sync --locked
          npm --prefix apps/web ci
      - name: Install test browser
        working-directory: apps/web
        run: npx playwright install --with-deps --no-shell chromium
      - name: Shared quality gate (Fake only)
        run: uv --cache-dir .uv-cache run --locked python -m scripts.check
      - name: Retain only quality and browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-${{ github.run_id }}
          path: |
            artifacts/quality/
            artifacts/playwright/
            artifacts/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
